<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>फॉर्मेट 2: शाही मैरून हेरिटेज प्रशस्ति — Reed Global Public School</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cert-primary: #13294b;
      --cert-secondary: #b48327;
      --cert-accent: #d4af37;
      --cert-bg: #fffdf7;
      --cert-bg-tint: #f8f2e2;
    }
    body {
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    .font-cinzel { font-family: 'Cinzel', 'Noto Serif Devanagari', serif; }
    .font-serif-display { font-family: 'Playfair Display', 'Noto Serif Devanagari', serif; }
    .font-script { font-family: 'Great Vibes', 'Playfair Display', cursive; }
    .cert-pattern-overlay {
      position: absolute; inset: 0;
      background-image: radial-gradient(var(--cert-secondary) 0.55px, transparent 0.55px), radial-gradient(var(--cert-primary) 0.55px, transparent 0.55px);
      background-size: 28px 28px; background-position: 0 0, 14px 14px;
      opacity: 0.055; pointer-events: none; z-index: 0;
    }
    .cert-watermark-layer {
      position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%);
      z-index: 1; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .watermark-frame-soft { border-radius: 14px; }
    .watermark-frame-seal { border: 2px dashed var(--cert-secondary); border-radius: 12px; padding: 8px; }
    .watermark-frame-sharp { border-radius: 0px; }
    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff; }
      #certificateMount { transform: scale(1) !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4">
  <!-- Top Action Bar (Hidden when printing/exporting) -->
  <div class="no-print w-full max-w-[1056px] mb-4 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
    <div class="flex items-center gap-3">
      <a href="data_entry.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-600 text-xs font-semibold">← डेटा एंट्री पेज पर वापस जाएं</a>
      <span class="text-xs font-bold text-white">फॉर्मेट 2: शाही मैरून हेरिटेज प्रशस्ति (format_2_heritage.html)</span>
    </div>
    <div class="flex items-center gap-2">
      <a href="format_1_royal.html" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-200">फॉर्मेट 1</a>
      <a href="format_2_heritage.html" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-200">फॉर्मेट 2</a>
      <a href="format_3_modern.html" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-200">फॉर्मेट 3</a>
      <button onclick="downloadPdf()" class="px-3.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow">📥 PDF डाउनलोड करें</button>
      <button onclick="window.print()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs">🖨️ प्रिंट</button>
    </div>
  </div>

  <!-- TEMPLATE HTML SOURCE (आप इस नीचे वाले टेम्पलेट में कभी भी बदलाव कर सकते हैं) -->
  <template id="certTemplateSource">
<!-- FORMAT 2: HERITAGE MAROON & GOLD ROYAL ARCH (format_2_heritage.html) -->
<div class="cert-canvas" style="width:1056px;height:748px;background:linear-gradient(135deg, #fffcf7 0%, #f9efe6 50%, #fffcf7 100%);color:#2b1810;position:relative;box-sizing:border-box;overflow:hidden;font-family:'Inter','Noto Sans Devanagari',sans-serif;">
  <div class="cert-pattern-overlay"></div>
  <!-- Outer Ridge Heritage Frame -->
  <div style="position:absolute;inset:12px;border:7px ridge #b8860b;outline:3px solid #6b1426;outline-offset:-12px;pointer-events:none;z-index:2;"></div>
  <div style="position:absolute;inset:30px;border:1.5px dashed #b8860b;pointer-events:none;z-index:2;"></div>

  <!-- Top & Bottom Heritage Gold Corner Medallions -->
  <div style="position:absolute;top:18px;left:18px;width:36px;height:36px;background:#6b1426;border:2px solid #d4af37;border-radius:8px;z-index:5;display:flex;align-items:center;justify-content:center;color:#f9e596;font-size:16px;">❖</div>
  <div style="position:absolute;top:18px;right:18px;width:36px;height:36px;background:#6b1426;border:2px solid #d4af37;border-radius:8px;z-index:5;display:flex;align-items:center;justify-content:center;color:#f9e596;font-size:16px;">❖</div>
  <div style="position:absolute;bottom:18px;left:18px;width:36px;height:36px;background:#6b1426;border:2px solid #d4af37;border-radius:8px;z-index:5;display:flex;align-items:center;justify-content:center;color:#f9e596;font-size:16px;">❖</div>
  <div style="position:absolute;bottom:18px;right:18px;width:36px;height:36px;background:#6b1426;border:2px solid #d4af37;border-radius:8px;z-index:5;display:flex;align-items:center;justify-content:center;color:#f9e596;font-size:16px;">❖</div>

  <!-- Center Square Watermark -->
  <div class="cert-watermark-layer {{WATERMARK_FRAME_CLASS}}" style="{{WATERMARK_STYLE}}">
    <img src="{{WATERMARK_IMG}}" alt="Watermark" class="w-full h-full {{WATERMARK_FIT_CLASS}}" />
  </div>

  <!-- Main Content -->
  <div class="relative z-10 h-full flex flex-col justify-between px-14 py-9">
    <!-- Heritage Royal Banner Header -->
    <div class="bg-gradient-to-r from-[#520d1b] via-[#6b1426] to-[#520d1b] text-white rounded-2xl px-6 py-3.5 border-2 border-[#d4af37] shadow-lg flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-20 h-20 rounded-2xl border-2 border-[#f9e596] bg-white p-1.5 flex items-center justify-center shrink-0 shadow">
          <img src="{{SCHOOL_LOGO}}" alt="School Crest" class="w-full h-full object-contain" />
        </div>
        <div class="text-left">
          <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-[#f9e596]">★ सा विद्या या विमुक्तये • रीड ग्लोबल सम्मान ★</div>
          <h1 class="font-cinzel text-[25px] leading-tight font-extrabold tracking-wide text-white uppercase mt-0.5">{{SCHOOL_EN}}</h1>
          <h2 class="{{SCHOOL_HI_VISIBILITY}} text-[18px] leading-snug font-bold text-[#f9e596]" style="font-family:'Noto Serif Devanagari',serif;">{{SCHOOL_HI}}</h2>
          <p class="text-[10.5px] text-amber-100/90 mt-0.5">{{SCHOOL_SUB}}</p>
        </div>
      </div>
      <div class="text-right shrink-0 border-l border-amber-400/30 pl-4">
        <div class="text-[10px] uppercase tracking-wider text-amber-200">प्रमाण-पत्र क्र. / Serial</div>
        <div class="text-xs font-extrabold text-[#f9e596] mt-0.5">{{SERIAL_NO}}</div>
        <div class="mt-2 inline-block px-2.5 py-0.5 rounded bg-amber-400/20 border border-amber-300/40 text-[10px] font-bold text-amber-100">सत्र: {{SESSION}}</div>
      </div>
    </div>

    <!-- Center Ribbon Title & Student Profile Row -->
    <div class="my-auto space-y-3 px-2">
      <div class="text-center">
        <div class="inline-flex items-center gap-3 px-7 py-1 rounded-md bg-[#fff6e0] border-2 border-[#b8860b] shadow-sm">
          <span class="text-[#6b1426] text-sm">⚜</span>
          <span class="font-cinzel text-base font-extrabold tracking-[0.15em] text-[#6b1426] uppercase">{{CERT_TITLE}}</span>
          <span class="text-[#6b1426] text-sm">⚜</span>
        </div>
        <div class="{{TITLE_HI_VISIBILITY}} text-xs font-bold text-[#6b1426] mt-1">{{CERT_TITLE_HI}}</div>
      </div>

      <!-- Two-Column Heritage Body: Left Student Info + Right Student Photo -->
      <div class="flex items-center justify-between gap-6 max-w-[880px] mx-auto bg-white/80 border-2 border-[#b8860b]/60 rounded-2xl p-4 shadow-sm">
        <div class="flex-1 text-center sm:text-left space-y-2">
          <p class="text-xs italic font-serif-display text-slate-600">{{LEAD_LINE}}</p>
          <div class="font-serif-display text-[28px] leading-tight font-bold text-[#6b1426] border-b-2 border-[#b8860b] pb-1 inline-block">{{STUDENT_NAME}}</div>

          <div class="grid grid-cols-3 gap-x-4 gap-y-2 pt-1 text-left">
            {{DETAILS_GRID_HTML}}
          </div>
        </div>

        <div style="visibility:{{PHOTO_VISIBILITY}};" class="shrink-0 flex flex-col items-center border-l border-[#b8860b]/40 pl-5">
          <div class="w-28 h-32 {{PHOTO_FRAME_CLASS}} border-2 border-[#6b1426] outline outline-2 outline-[#d4af37] bg-white shadow-md overflow-hidden flex items-center justify-center">
            {{PHOTO_INNER_HTML}}
          </div>
          <span class="mt-1.5 text-[10px] font-bold text-[#6b1426] uppercase tracking-wider">Verified Student</span>
        </div>
      </div>

      <!-- Citation Box -->
      <div class="max-w-[880px] mx-auto text-center bg-[#6b1426]/5 border border-[#6b1426]/20 rounded-xl py-2.5 px-5">
        <p class="text-[13px] leading-relaxed font-semibold text-[#2b1810]">“{{CITATION}}”</p>
      </div>
    </div>

    <!-- Heritage Footer -->
    <div class="pt-1 flex items-end justify-between px-4">
      <div class="text-left min-w-[150px]">
        <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">जारी दिनांक / Date</div>
        <div class="text-xs font-bold text-[#6b1426] mt-0.5 border-b-2 border-[#b8860b] pb-0.5 inline-block min-w-[115px]">{{ISSUE_DATE}}</div>
      </div>

      <div class="text-center min-w-[170px]">
        <div class="font-script text-lg text-[#6b1426] h-6">{{SIGN_LEFT_NAME}}</div>
        <div class="border-t-2 border-[#6b1426] pt-1 text-xs font-bold text-[#6b1426]">{{SIGN_LEFT_TITLE}}</div>
      </div>

      <div class="flex flex-col items-center -mb-1">
        <div class="w-18 h-18 w-[74px] h-[74px] rounded-full bg-gradient-to-br from-[#8f1d35] via-[#6b1426] to-[#3d0813] p-1 shadow-lg flex items-center justify-center border-2 border-[#d4af37]">
          <div class="w-full h-full rounded-full border border-dashed border-[#f9e596] flex flex-col items-center justify-center text-center">
            <span class="text-[7px] font-bold tracking-widest text-[#f9e596] uppercase">HERITAGE SEAL</span>
            <span class="text-[10px] font-black text-white my-0.5">★ RGPS ★</span>
            <span class="text-[6.5px] font-semibold text-[#f9e596] uppercase">AUTHENTIC</span>
          </div>
        </div>
      </div>

      <div class="text-center min-w-[180px]">
        <div class="font-script text-lg text-[#6b1426] h-6">{{SIGN_RIGHT_NAME}}</div>
        <div class="border-t-2 border-[#6b1426] pt-1 text-xs font-bold text-[#6b1426]">{{SIGN_RIGHT_TITLE}}</div>
        <div class="text-[10px] font-semibold text-[#b8860b]">{{SCHOOL_EN}}</div>
      </div>
    </div>
  </div>
</div>
  </template>

  <div id="certificateMount" class="shadow-2xl"></div>

        '{DETAILS_GRID_HTML}': gridHtml,
        '{PHOTO_VISIBILITY}': d.showPhoto !== false ? 'visible' : 'hidden',
        '{PHOTO_FRAME_CLASS}': d.photoShape === 'circle' ? 'rounded-full' : (d.photoShape === 'square' ? 'rounded-none' : 'rounded-xl'),
        '{PHOTO_INNER_HTML}': photoInner,
        '{WATERMARK_STYLE}': wmStyle,
        '{WATERMARK_IMG}': d.watermarkDataUrl || DEFAULT_LOGO,
        '{WATERMARK_FIT_CLASS}': d.watermarkFit === 'cover' ? 'object-cover' : 'object-contain',
        '{WATERMARK_FRAME_CLASS}': 'watermark-frame-' + (d.watermarkFrame || 'soft')
      };

      Object.keys(replacements).forEach(k => {
        html = html.split(k).join(replacements[k]);
      });
      document.getElementById('certificateMount').innerHTML = html;
    }

    async function downloadPdf() {
      const node = document.querySelector('#certificateMount .cert-canvas');
      if (!node) return;
      const canvas = await window.html2canvas(node, { scale: 2, useCORS: true, backgroundColor: '#fffdf7', width: 1056, height: 748 });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
      pdf.save('format_2_heritage_Certificate.pdf');
    }

    window.addEventListener('DOMContentLoaded', renderStandalone);
  </script>
</body>
</html>
